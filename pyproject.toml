[project]
name = "Ridgecrest"
version = "0.1.0"
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "matplotlib",
    "xarray>=2024.7.0",
    "rioxarray>=0.15.0",
    "rasterio>=1.4.3",
    "shapely>=2.0.7",
    "geopandas>=1.0.1",
    "scipy>=1.13.1",
    "csi",
    "okada4py",
    "h5py>=3.14.0",
    "cartopy>=0.23.0",
    "netcdf4>=1.7.2",
    "seaborn>=0.13.2",
    "mpmath>=1.4.0",
    "scikit-learn>=1.6.1",
    "pymap3d>=3.2.0",
    "cmocean>=4.0.3",
    "rockhound>=0.2.0",
    "pillow>=11.3.0",
    "colormaps>=0.5.0",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ipympl>=0.10.0",
]

[tool.uv.sources]
csi = { path = "../../packages/csi" }
okada4py = { path = "../../packages/okada4py" }
